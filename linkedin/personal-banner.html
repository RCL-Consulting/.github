<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Personal LinkedIn banner</title>
<!-- The personal banner from rcl-brand's Social template (source/templates/social/Social.dc.html,
     #personal-banner), copied as designed with its placeholder headline filled in. 1584 x 396; the
     profile photo covers the lower left, so content starts right of 420px. -->
<style>
  @font-face{font-family:'Cormorant Garamond';src:url('../../rcl-brand/fonts/CormorantGaramond-Variable.woff2') format('woff2');font-weight:400 700}
  @font-face{font-family:'Jost';src:url('../../rcl-brand/fonts/Jost-Variable.woff2') format('woff2');font-weight:100 900}
  html,body{margin:0;background:#0b1727}
  body{font-family:Jost,Futura,'Century Gothic',system-ui,sans-serif}
</style>
</head>
<body>
<div id="personal-banner" style="position:relative;width:1584px;height:396px;overflow:hidden;background:#0b1727;color:#fbf9f2;flex:none">
<div style="position:absolute;right:24px;top:24px;bottom:96px;width:440px;background:url(../../rcl-brand/assets/Motifs/displacement.svg) center/contain no-repeat;opacity:.4"></div>
<div style="position:absolute;left:480px;top:0;bottom:0;width:600px;display:flex;flex-direction:column;justify-content:center;gap:20px">
<p style="margin:0;font-family:'Cormorant Garamond',Georgia,serif;font-size:64px;line-height:1;font-weight:600">Renier Cloete</p>
<div style="width:48px;height:2px;background:#e27a55"></div>
<p style="margin:0;max-width:560px;white-space:normal;font-size:17px;line-height:24px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:#fbf9f2">Structural engineer · Director, RCL Consulting</p>
<p style="margin:0;font-size:15px;line-height:20px;font-weight:500;letter-spacing:.28em;text-transform:uppercase;color:#5fb6c6">FEA news · Research · Inside RCL</p>
</div>
<img src="../../rcl-brand/assets/Logos/rcl-logo-reversed.svg" alt="RCL Consulting" style="position:absolute;right:48px;bottom:36px;height:44px">
</div>
</body>
</html>
