<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Personal LinkedIn banner</title>
<!-- The personal banner from rcl-brand's Social template (source/templates/social/Social.dc.html,
     #personal-banner), with its placeholder headline filled in. 1584 x 396; the profile photo
     covers the lower left, so content starts right of 420px.
     Scaled up from the template (2026-10-03): LinkedIn shows the banner at about half size, where
     the template's 17px headline read at ~8px and the 44px logo at ~22px. -->
<style>
  @font-face{font-family:'Cormorant Garamond';src:url('../../rcl-brand/fonts/CormorantGaramond-Variable.woff2') format('woff2');font-weight:400 700}
  @font-face{font-family:'Jost';src:url('../../rcl-brand/fonts/Jost-Variable.woff2') format('woff2');font-weight:100 900}
  html,body{margin:0;background:#0b1727}
  body{font-family:Jost,Futura,'Century Gothic',system-ui,sans-serif}
</style>
</head>
<body>
<div id="personal-banner" style="position:relative;width:1584px;height:396px;overflow:hidden;background:#0b1727;color:#fbf9f2;flex:none">
<div style="position:absolute;right:24px;top:28px;bottom:120px;width:420px;background:url(../../rcl-brand/assets/Motifs/displacement.svg) center/contain no-repeat;opacity:.4"></div>
<div style="position:absolute;left:480px;top:0;bottom:0;width:660px;display:flex;flex-direction:column;justify-content:center;gap:22px">
<p style="margin:0;font-family:'Cormorant Garamond',Georgia,serif;font-size:84px;line-height:1;font-weight:600">Renier Cloete</p>
<div style="width:64px;height:3px;background:#e27a55"></div>
<p style="margin:0;font-size:24px;line-height:32px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:#fbf9f2">Structural engineer<br>Director, RCL Consulting</p>
<p style="margin:0;font-size:21px;line-height:28px;font-weight:500;letter-spacing:.28em;text-transform:uppercase;color:#5fb6c6;white-space:nowrap">FEA news · Research · Inside RCL</p>
</div>
<img src="../../rcl-brand/assets/Logos/rcl-logo-reversed.svg" alt="RCL Consulting" style="position:absolute;right:48px;bottom:32px;height:64px">
</div>
</body>
</html>
